server:
  port: 8081
  
spring:
  application:
    name: USER-SERVICE
  security:
    user:
      name: admin
      password: admin123
    
  datasource:
    url: jdbc:mysql://localhost:3306/userservice
    username: root
    password: ccs@0909
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
