spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: ORDER-SERVICE
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orderController/**
  
        - id: USER-SERVICE
          uri: lb://USER-SERVICE
          predicates:
            - Path=/userController/**

server:
  port: 8080

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/